<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grand Luxe</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
 <link rel="stylesheet" href="../public/style.css">
</head>

<body>

<div class="ambient"></div>
<div class="grid-overlay"></div>

<div class="auth-wrapper">
  <div class="auth-shell">

    <!-- LEFT -->
    <div class="auth-left">
      <div class="auth-orb"></div>
      <div class="auth-logo">⬡ Grand Luxe</div>
      <div class="auth-title">Where <em>luxury</em><br>meets comfort.</div>
      <div class="auth-sub">Book rooms, manage stays,<br>and enjoy exclusive privileges.</div>
    </div>

    <!-- RIGHT -->
    <div class="auth-right">

      <!-- TABS -->
      <div class="auth-tabs">
        <div class="auth-tab active" data-tab="login">Sign In</div>
        <div class="auth-tab" data-tab="signup">Create Account</div>
      </div>

      <!-- LOGIN -->
      <div class="auth-form active" id="form-login">
       <form action="../controllers/AuthController.php?action=login" method="POST">
          <div class="field">
            <label>Email</label>
            <input type="email" name="email" placeholder="you@example.com" required>
          </div>
          <div class="field">
            <label>Password</label>
            <input type="password" name="password" placeholder="Password" required>
          </div>
          <button type="submit" class="btn-auth">Sign In</button>
        </form>
        <div class="auth-footer">
          No account? <span class="link" data-tab="signup">Create one →</span>
        </div>
      </div>

      <!-- SIGNUP -->
      <div class="auth-form" id="form-signup">
        <form action="../controllers/AuthController.php?action=signup" method="POST">
          <div class="field-row">
            <div class="field">
              <label>First Name</label>
              <input type="text" name="fname" placeholder="First Name" required>
              <span class="field-err">Required.</span>
            </div>
            <div class="field">
              <label>Last Name</label>
              <input type="text" name="lname" placeholder="Last Name" required>
              <span class="field-err">Required.</span>
            </div>
          </div>
          <div class="field">
            <label>Email</label>
            <input type="email" name="email" placeholder="you@example.com" required>
            <span class="field-err">Valid email required.</span>
          </div>
          <div class="field-row">
            <div class="field">
              <label>Password</label>
              <input type="password" name="password" placeholder="Password" required>
              <span class="field-err">Min 6 characters.</span>
            </div>
            <div class="field">
              <label>Confirm Password</label>
              <input type="password" name="confirm_password" placeholder="Confirm Password" required>
              <span class="field-err">Doesn't match.</span>
            </div>
          </div>
          <button type="submit" class="btn-auth">Create Account</button>
        </form>
        <div class="auth-footer">
          Have an account? <span class="link" data-tab="login">Sign in →</span>
        </div>
      </div>

    </div><!-- end auth-right -->
  </div><!-- end auth-shell -->
</div><!-- end auth-wrapper -->

<div id="toast"></div>

<script src="../public/script.js"></script>

<script>
document.querySelectorAll('.auth-tab, .link[data-tab]').forEach(el => {
  el.addEventListener('click', () => {
    const tab = el.getAttribute('data-tab');
    const loginForm  = document.getElementById('form-login');
    const signupForm = document.getElementById('form-signup');

    if (tab === 'login') {
      loginForm.classList.add('active');
      signupForm.classList.remove('active');
    }
    if (tab === 'signup') {
      signupForm.classList.add('active');
      loginForm.classList.remove('active');
    }

    document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
    if (el.classList.contains('auth-tab')) el.classList.add('active');
  });
});
</script>

</body>
</html>
